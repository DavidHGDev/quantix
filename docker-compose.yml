services:
  postgres:
    image: postgres:17
    container_name: quantix_db
    restart: always
    environment:
      POSTGRES_DB: quantix
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: quantixAdmin456
    ports:
      - "5432:5432"
    volumes:
      - quantix_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_quantix
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quantix.com
      PGADMIN_DEFAULT_PASSWORD: quantixAdmin456
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - quantix_pgadmin_data:/var/lib/pgadmin

volumes:
  quantix_postgres_data:
  quantix_pgadmin_data: