<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantix POS - Acceso</title>
    <link rel="stylesheet" href="./css/login.css">
    <script type="module" src="./src/login.js"></script>
</head>
<body>
    <!-- Botón para alternar el tema -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">🌙 Oscuro</button>

    <main>
        <form id="form-id" class="form">
            <h1>Quantix</h1>
            <div class="grupo-inputs">
                <label for="email">Correo</label>
                <input type="email" id="email" placeholder="admin@quantix.com" name="email">
            </div>

            <div class="grupo-inputs">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="**********" name="password">
            </div>

            <button type="submit" class="btn-ingresar">Iniciar Sesión</button>
            <span id="span-admin" class="span-message"></span>
        </form>
    </main>
</body>
</html>
